<!doctype html>
<!--
  Thumbnail graphic — Project 19 "No Es Talento, Es GRIT: La Ciencia de No Rendirte"
  Theo docs/quy-tac-thumbnail-graphic.md: 1 con số + punch 2–3 chữ + ngữ cảnh ≤ 7 chữ + hình dữ liệu.
  Phát hiện: fórmula de Angela Duckworth ("Grit") — talento × esfuerzo = habilidad; habilidad × esfuerzo = logro.
  El esfuerzo aparece dos veces, el talento solo una (video 1:32–1:38, mục "La Fórmula del Esfuerzo").
  Hình: 2 cột ngang — cột xám = talento (1 lần), cột màu nhấn = esfuerzo (2 lần).
  Render: node tools/render_thumb_graphic.js "<thư mục thumbnail>"
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Thumbnail graphic P19</title>
<style>
  @font-face { font-family: "Anton"; src: url("../../../fonts/Anton-Regular.ttf"); }
  @font-face { font-family: "EB Garamond"; font-style: italic; src: url("../../../fonts/EBGaramond-Italic.ttf"); }
  html, body { margin: 0; background: #0A0908; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const CONTENT = {
  number: "2X",
  punch: "CUENTA DOBLE",
  context: ["el esfuerzo, en la", "fórmula de Duckworth"],
  bars: [1, 2],            // xám = 1 lần (talento), màu nhấn = 2 lần (esfuerzo)
};
const ACC = "#E8A23C";     // màu nhấn playlist 02_Mentalidad y Exito (= màu video)
const INK = "#F4EFE7", BG = "#0A0908";
const W = 1280, H = 720, M = 64, TEXT_X = 668, SAFE_BOTTOM = 634;

function fitFont(ctx, text, family, maxPx, maxW) {
  let px = maxPx;
  for (; px > 20; px -= 2) { ctx.font = `${px}px ${family}`; if (ctx.measureText(text).width <= maxW) break; }
  return px;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// Biểu tượng trắng: mũi tên đi lên (nỗ lực xây tiếp lên kỹ năng)
function arrowUp(ctx, cx, cy, s) {
  ctx.save(); ctx.translate(cx, cy); ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(0, -s / 2); ctx.lineTo(s * 0.42, -s * 0.06); ctx.lineTo(s * 0.15, -s * 0.06);
  ctx.lineTo(s * 0.15, s / 2); ctx.lineTo(-s * 0.15, s / 2); ctx.lineTo(-s * 0.15, -s * 0.06);
  ctx.lineTo(-s * 0.42, -s * 0.06); ctx.closePath(); ctx.fill(); ctx.restore();
}

document.fonts.load('330px "Anton"').then(() => document.fonts.load('italic 44px "EB Garamond"')).then(() => document.fonts.ready).then(() => {
  const ctx = document.getElementById("c").getContext("2d");
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

  // Quầng sáng màu nhấn ~10% sau khối hình
  const g = ctx.createRadialGradient(341, 420, 20, 341, 420, 420);
  g.addColorStop(0, "rgba(232,162,60,0.13)"); g.addColorStop(1, "rgba(232,162,60,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 2 cột ngang trong vùng x 64–620, y 58–612 (không nhãn)
  const X0 = 64, FULL = 556, BH = 150, R = 12;
  const max = Math.max(...CONTENT.bars);
  const ys = [150, 330];
  roundRect(ctx, X0, ys[0], FULL * CONTENT.bars[0] / max, BH, R); ctx.fillStyle = "rgba(244,239,231,0.22)"; ctx.fill();
  roundRect(ctx, X0, ys[1], FULL * CONTENT.bars[1] / max, BH, R); ctx.fillStyle = ACC; ctx.fill();
  // vạch mốc nửa đường: cột màu nhấn = đúng 2 lần cột xám
  ctx.setLineDash([10, 10]); ctx.strokeStyle = "rgba(244,239,231,0.35)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(X0 + FULL / 2, ys[0] - 24); ctx.lineTo(X0 + FULL / 2, ys[1] + BH + 24); ctx.stroke(); ctx.setLineDash([]);
  arrowUp(ctx, X0 + FULL * 0.78, ys[1] + BH / 2, 104);

  // Cột chữ
  const maxW = W - M - TEXT_X;
  const numPx = fitFont(ctx, CONTENT.number, '"Anton"', 330, maxW);
  const punchPx = fitFont(ctx, CONTENT.punch, '"Anton"', 130, maxW);
  const ctxPx = 44, ctxLead = 54;
  const blockH = numPx * 0.86 + 18 + punchPx * 0.9 + 26 + ctxLead * CONTENT.context.length;
  let y = Math.max(M, (SAFE_BOTTOM - M - blockH) / 2 + M - 10);

  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ctx.fillStyle = INK; ctx.font = `${numPx}px "Anton"`;
  y += numPx * 0.86; ctx.fillText(CONTENT.number, TEXT_X, y);
  ctx.fillStyle = ACC; ctx.font = `${punchPx}px "Anton"`;
  y += 18 + punchPx * 0.9; ctx.fillText(CONTENT.punch, TEXT_X, y);
  ctx.fillStyle = "rgba(244,239,231,0.88)"; ctx.font = `italic ${ctxPx}px "EB Garamond"`;
  y += 26;
  for (const line of CONTENT.context) { y += ctxLead; ctx.fillText(line, TEXT_X + 4, y - 14); }
  window.__layout = { numPx, punchPx, bottom: y - 14 };
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
